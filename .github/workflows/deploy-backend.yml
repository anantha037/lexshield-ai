name: Deploy Backend

on:
  push:
    branches: [main]

env:
  PROJECT_ID: lexshield-ai-prod
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev/lexshield-ai-prod/lexshield

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push
        run: |
          docker build -t $REGISTRY/backend:$GITHUB_SHA -t $REGISTRY/backend:latest .
          docker push $REGISTRY/backend:$GITHUB_SHA
          docker push $REGISTRY/backend:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy lexshield-backend \
            --image=$REGISTRY/backend:$GITHUB_SHA \
            --region=$REGION \
            --platform=managed